# starter-app local PostgreSQL: TCP only over TLS with SCRAM; plain TCP is refused (ADR 0222).
# Mounted read-only and selected with `-c hba_file=...`, so it applies to existing volumes too.
# TYPE    DATABASE USER ADDRESS      METHOD
local     all      all               trust
hostssl   all      all  0.0.0.0/0    scram-sha-256
hostssl   all      all  ::/0         scram-sha-256
hostnossl all      all  0.0.0.0/0    reject
hostnossl all      all  ::/0         reject

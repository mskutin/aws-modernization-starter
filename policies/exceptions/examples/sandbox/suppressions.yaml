# EXAMPLE suppression register for the live-validation sandbox — schema: see ../../suppressions.yaml
#
# NOT LOADED BY ANYTHING. This file is an EXAMPLE for the opt-in live-validation `Sandbox` stage
# (`-c envs=sandbox`, an ordinary, dedicated AWS account; not a governed environment). Its entries
# relax baseline controls for cost and teardown reasons and nobody in your project has approved
# them: they are `status: example`, carry no dates and never apply (a loaded example is an
# EXAMPLE_NOT_ADOPTED error). Until you adopt them, synthesizing the sandbox fails; the default CI
# pipeline (dev/staging/prod/integration) is unaffected.
#
# To use the sandbox in YOUR account: review every entry against your account and risk
# appetite; copy the ones you accept into policies/exceptions/suppressions.yaml; remove
# `status: example`; set createdAt/reviewedAt/reviewBy (review at most 180 days ahead),
# owner and your ticket, in a reviewed MR (policies/ is a gate path). If your CI records
# approvals outside the repository (STARTER_EXCEPTION_APPROVALS), record the adopted entries'
# digests there (`starter-policies approval-digests`). Keep the window short: the sandbox is torn
# down after each run, and an expired entry fails the policy gate. See docs/policy-as-code.md.
#
# PROPOSED BASELINE — not an approved control set of any organization or regulator.
schemaVersion: 1
# Each entry is either the sandbox twin of a governed entry (same finding, justification restated
# for the sandbox) or a sandbox-only deviation; none applies to dev/staging/prod or to the
# integration mini-stack.
suppressions:
  - id: SUP-0400
    status: example
    ruleId: AwsSolutions-ECS2
    construct: ApiService
    resources: [TaskDefinition/Resource]
    environments: [sandbox]
    justification: >-
      SANDBOX (live validation, not a governed environment): same as SUP-0001 — the API container receives only non-secret
      configuration as environment variables (the sandbox test issuer URL included); no database
      credential is in the task definition (IAM database authentication).
    owner: platform-team
    ticket: sandbox-profile
  - id: SUP-0401
    status: example
    ruleId: AwsSolutions-IAM5[Resource::*]
    construct: ApiService
    resources: [TaskDefinition/ExecutionRole/DefaultPolicy/Resource]
    environments: [sandbox]
    allowedActions: [ecr:GetAuthorizationToken]
    justification: >-
      SANDBOX (live validation, not a governed environment): same as SUP-0002 — ecr:GetAuthorizationToken has no
      resource-level permissions; image pull, log and KMS actions stay scoped.
    owner: platform-team
    ticket: sandbox-profile

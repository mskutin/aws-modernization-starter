# Mandatory gate. The concrete job `gates:mandatory` is generated (its `needs`
# lists every gated job with optional: true). It starts only when every present
# gated job passed, then proves that every job the impact analysis requires was
# actually present and passed (GATE_<id> markers). Integration tests, publishing,
# AI review and approval all come after it.
.gates:
  extends: [.node-bare, .rules:always]
  stage: gate
  interruptible: true
  script:
    - node tools/impact/src/cli.ts gate --impact reports/impact/impact.json --out-dir reports/gate
  artifacts:
    when: always
    expire_in: 2 weeks
    expose_as: 'Gate report'
    paths: [reports/gate/]

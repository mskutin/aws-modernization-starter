# Code quality: repo-wide lint/format + per-component build/typecheck/unit tests
# (the per-component jobs are generated from components.yaml and extend
# .component-test).

.component-test:
  extends: [.node, .gated]
  stage: verify
  needs: [{ job: impact, artifacts: false }]
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths: [reports/]
    reports:
      junit: reports/junit/*.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage/*/cobertura-coverage.xml

lint:
  extends: [.node, .gated, .rules:always]
  stage: verify
  needs: [{ job: impact, artifacts: false }]
  script:
    - mkdir -p reports/lint
    # Root `lint` script + JSON output for the Code Quality widget.
    - status=0; pnpm run lint --format json --output-file reports/lint/eslint.json || status=$?
    - node tools/ci/src/cli.ts codequality eslint reports/lint/eslint.json reports/lint/gl-code-quality-report.json
    - exit $status
  artifacts:
    when: always
    expire_in: 1 week
    paths: [reports/lint/]
    reports:
      codequality: reports/lint/gl-code-quality-report.json

format:
  extends: [.node, .gated, .rules:always]
  stage: verify
  needs: [{ job: impact, artifacts: false }]
  script:
    - pnpm run format:check

# OpenAPI document must be regenerated and committed with contract changes.
contracts:openapi-drift:
  extends: [.node, .gated, '.impact:contracts']
  stage: verify
  needs: [{ job: impact, artifacts: false }]
  script:
    - pnpm --filter @starter/contracts run openapi:generate
    - sh tools/ci/scripts/assert-no-drift.sh reports/contracts packages/contracts/openapi
  artifacts:
    when: always
    expire_in: 1 week
    paths: [reports/contracts/]

# (https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/<service>/current/ap-southeast-1/index.json
# and the global AmazonCloudFront offer). The publication date of each offer
# file is recorded per service. On-demand list prices in USD, excluding tax,
# free tiers, Savings Plans / Reserved Instances, enterprise or negotiated commercial
# terms, and data transfer unless listed. Re-verify with the AWS Pricing
# Calculator before using numbers for budget decisions. Bump `version` and
# `capturedAt` whenever a value changes.
